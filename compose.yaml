services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: academia
      MYSQL_USER: projeto
      MYSQL_PASSWORD: projeto123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
